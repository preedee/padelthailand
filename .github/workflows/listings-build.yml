name: listings-build

# Rebuilds data/tournaments.json and data/events.json from the Google Sheet (curated Tournaments and Events tabs, plus
# form submissions a moderator has set to Status = live), then re-renders the club pages so each one shows its upcoming
# tournaments. Commits only when a generated file changed. No secrets: the sheet is link-readable and the job writes
# with the repository's built-in token.
#
# Schedule: every day 20:00 UTC = 03:00 Asia/Bangkok. Manual run: Actions tab -> listings-build -> Run workflow.
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

# same group as clubs-build so the two never commit at the same time
concurrency:
  group: clubs-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Build tournament and event listings
        run: bun scripts/build-listings.ts

      - name: Re-render club pages (upcoming tournaments teaser)
        run: bun scripts/build-directory.ts

      - name: Re-render listing pages (tournament structured data, events indexing rule)
        run: bun scripts/build-listing-pages.ts

      - name: Build sitemap, robots.txt and llms.txt
        run: bun scripts/build-seo.ts

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tournaments.json data/events.json clubs regions tournaments events 404.html sitemap.xml robots.txt llms.txt llms-full.txt
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Listings refresh $(date -u +%F)"
          git push
