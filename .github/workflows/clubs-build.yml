name: clubs-build

# Rebuilds data/clubs.json, every club page, the club directory and the sitemap from the club registry
# (Supabase view clubs.clubs_public, read with the public anon key that is already in the build script), and commits
# only when a generated file changed. No secrets are used; the job writes with the repository's built-in token.
#
# Schedule: Saturday 22:00 UTC = Sunday 05:00 Asia/Bangkok, two hours after the registry's own weekly refresh.
# Manual run: Actions tab -> clubs-build -> Run workflow.
on:
  schedule:
    - cron: "0 22 * * 6"
  workflow_dispatch:
  # the admin photo tool saves picks and hidden photos by committing these two files: rebuild the pages when that happens
  push:
    branches: [main]
    paths:
      - data/club-photo-picks.json
      - data/club-photo-hidden.json

permissions:
  contents: write

concurrency:
  group: clubs-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Build club data
        run: bun scripts/build-clubs.ts --no-pages

      - name: Build directory pages (home, clubs, club pages)
        run: bun scripts/build-directory.ts

      - name: Build the admin pages (owner tools)
        run: bun scripts/build-admin.ts

      - name: Build sitemap, robots.txt and llms.txt
        run: bun scripts/build-seo.ts

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/clubs.json data/club-slugs.json data/clubs-full.json clubs regions index.html events sitemap.xml robots.txt llms.txt llms-full.txt admin
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Club registry refresh $(date -u +%F)"
          git push
