<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0A1612" />
  <base href="/competitions/">
  <title>Bangkok Community Cup — Home</title>
  <meta property="og:title" content="Bangkok Community Cup — Home">
  <meta property="og:description" content="Watch the live draft, browse the player pool, or jump to your team page.">
  <meta property="og:image" content="https://padelthailand.com/assets/cc-logo.png">
  <link rel="icon" href="/assets/tps-monogram.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- PadelThailand base tokens first (defines .theme-dark palette), then team overlay -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css" />
  <link rel="stylesheet" href="css/styles.css?v=204">
  <link rel="stylesheet" href="css/draft-team.css?v=39">
</head>
<body class="team theme-dark force-mobile-view">

<div id="app" class="team__app" data-view="team">

  <!-- App header -->
  <header class="team__header" role="banner">
    <div class="team__header-left">
      <img class="team__brand-logo" src="assets/tps-monogram.png" alt="TPS">
      <!-- Back-to-hub chevron is hidden on the hub itself; JS reveals it on
           team/pool views. Hardcoded to this canonical hub URL. -->
      <a class="team__back-hub" id="team-back-hub" href="tps-may2026/home/" hidden>← HUB</a>
    </div>
    <div class="team__header-center">
      <h1 class="team__title" id="team-title">Bangkok Community Cup</h1>
    </div>
    <div class="team__header-right">
      <div class="team__tournament-logo" id="team-tournament-logo" aria-label="Tournament logo">
        <img src="assets/cc-logo.png" alt="Bangkok Community Cup">
      </div>
    </div>
  </header>

  <!-- RECONNECTING banner — hidden by default; shown on subscription/network drop -->
  <div class="team__reconnect" id="team-reconnect" role="status" aria-live="polite" hidden>
    <span class="pulse"></span>
    <span>Reconnecting…</span>
  </div>

  <div class="pick-toast" id="pick-toast" role="status" aria-live="polite">
    <span class="toast__pre">You picked</span><span class="toast__name" id="pick-toast-name">—</span>
  </div>

  <!-- ============ POOL VIEW ============ -->
  <section class="team__view team__view--pool" data-view="pool" id="team-view-pool" hidden>
    <div class="team__pool-search-row">
      <input
        type="search"
        id="team-search"
        class="team__search-input"
        placeholder="Search players…"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      />
      <div class="team__pill" role="tablist" aria-label="Switch view">
        <button class="team__pill-tab" role="tab" data-view-target="pool">POOL</button>
        <button class="team__pill-tab" role="tab" data-view-target="team">TEAM</button>
      </div>
    </div>

    <div class="team__filter-row">
      <span class="team__filter-label">SORT</span>
      <div class="team__chip-group" id="team-sort-group" role="group" aria-label="Sort">
        <button class="team__chip" data-sort="rating">RATING <span class="team__sort-arrow">↓</span></button>
        <button class="team__chip" data-sort="name">NAME <span class="team__sort-arrow"></span></button>
      </div>
    </div>
    <div class="team__filter-row">
      <span class="team__filter-label">FILTER</span>
      <div class="team__chip-group" id="team-filter-group" role="group" aria-label="Filters">
        <button class="team__chip team__chip--prefs" data-filter="prefs" data-value="mine">★ Prefers us</button>
        <button class="team__chip team__chip--female" data-filter="gender" data-value="F">♀ F</button>
        <button class="team__chip team__chip--male"   data-filter="gender" data-value="M">♂ M</button>
        <button class="team__chip" data-filter="hand" data-value="L">L 🫲</button>
        <button class="team__chip" data-filter="hand" data-value="R">🫱 R</button>
        <button class="team__chip" data-filter="side" data-value="L">L ⬅️</button>
        <button class="team__chip" data-filter="side" data-value="R">➡️ R</button>
      </div>
    </div>
    <div class="team__filter-row">
      <span class="team__filter-label">PREFERS</span>
      <div class="team__chip-group" id="team-prefs-group" role="group" aria-label="Filter by preferred community"></div>
    </div>

    <div class="team__pool-list" id="team-pool-list" role="list" aria-live="polite">
      <!-- Player rows injected by draft-team.js -->
    </div>
  </section>

  <!-- ============ TEAM VIEW ============ -->
  <section class="team__view team__view--team" data-view="team" id="team-view-team" hidden>
    <div class="team__team-header" id="team-team-header">
      <!-- Team logo + name + pick + vertical pill injected by draft-team.js -->
    </div>

    <div class="team__roster-scroll">
      <div class="team__roster-section" id="team-roster-female">
        <div class="team__roster-head">
          <span class="team__roster-lbl team__roster-lbl--female">FEMALE PLAYERS</span>
        </div>
        <div class="team__roster-grid" id="team-roster-grid-female"></div>
      </div>
      <div class="team__roster-divider"></div>
      <div class="team__roster-section" id="team-roster-male">
        <div class="team__roster-head">
          <span class="team__roster-lbl team__roster-lbl--male">MALE PLAYERS</span>
        </div>
        <div class="team__roster-grid" id="team-roster-grid-male"></div>
      </div>
    </div>
  </section>

  <!-- ============ HUB VIEW (Rec #6) ============ -->
  <section class="team__view team__view--hub" data-view="hub" id="team-view-hub" hidden></section>

  <!-- Inline error block (missing/invalid params, fetch failures, etc) -->
  <div class="team__error" id="team-error" hidden></div>

</div>

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="js/draft-config.js?v=37"></script>
<script defer src="js/draft-utils.js?v=37"></script>
<script defer src="js/draft-supabase.js?v=37"></script>
<script defer src="js/draft-team.js?v=38"></script>

<!-- ──────────────────────────────────────────────────────────────────
     Live-Draft countdown lock (per-competition; no engine changes).
     Locks the .hub__watch card until the draft go-live moment, shows
     a live HH:MM:SS countdown, auto-unlocks at zero with no reload.
     ────────────────────────────────────────────────────────────── -->
<style>
  /* Hub-only: drop the dark-bg + border around the tournament logo so
     the transparent CC PNG floats on its own. The boxed treatment is
     fine on team/pool pages but looks heavy on the homepage hero row. */
  .team__tournament-logo {
    background: transparent;
    border: 0;
  }
  .team__tournament-logo img {
    padding: 0;
  }

  /* Locked draft card — until the countdown hits zero. */
  .hub__watch.is-locked {
    pointer-events: none;
    cursor: not-allowed;
    background: rgba(255, 183, 3, 0.06);
    border: 1px dashed rgba(255, 183, 3, 0.45);
    box-shadow: none;
  }
  .hub__watch.is-locked .hub__watch-icon {
    background: rgba(255, 183, 3, 0.12);
    color: var(--accent, #FFB703);
    font-size: 22px;
  }
  .hub__watch.is-locked .hub__watch-title { color: var(--accent, #FFB703); }
  .hub__watch.is-locked .hub__watch-sub  { color: var(--ink-dim, #C8D6CE); padding-top: 6px; }

  .hub__countdown-label {
    display: block;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-faint, #6B8276);
    margin-bottom: 4px;
    font-weight: 500;
  }
  .hub__countdown {
    display: block;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: clamp(22px, 6vw, 30px);
    font-weight: 700;
    letter-spacing: 0.06em;
    line-height: 1;
    color: var(--accent, #FFB703);
    font-variant-numeric: tabular-nums;
  }
</style>

<script>
  (function () {
    // ── Target: Wednesday 2026-05-20, 19:00 ICT (UTC+7) = 12:00 UTC ──
    // Date.UTC(year, monthIndex, day, hour, ...) — May is monthIndex 4.
    const TARGET_MS = Date.UTC(2026, 4, 20, 12, 0, 0);

    function pad(n) { return String(n).padStart(2, '0'); }

    function formatRemaining(ms) {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const days  = Math.floor(totalSec / 86400);
      const hours = Math.floor((totalSec % 86400) / 3600);
      const mins  = Math.floor((totalSec % 3600) / 60);
      const secs  = totalSec % 60;
      const hms = pad(hours) + ':' + pad(mins) + ':' + pad(secs);
      if (days === 0) return hms;
      return days + (days === 1 ? ' Day ' : ' Days ') + hms;
    }

    function lock(el) {
      if (el.dataset.locked === '1') return;
      el.dataset.locked = '1';
      el.classList.add('is-locked');
      el.setAttribute('aria-disabled', 'true');
      el.setAttribute('tabindex', '-1');
      const title = el.querySelector('.hub__watch-title');
      const sub   = el.querySelector('.hub__watch-sub');
      // innerHTML so the "Wed 19:00 ICT" half stays on one line — the
      // natural wrap point becomes the space before <span>.
      if (title) title.innerHTML = 'Live Draft starts <span style="white-space:nowrap">Wed 19:00 ICT</span>';
      if (sub) {
        sub.innerHTML =
          '<span class="hub__countdown-label">Available in</span>' +
          '<span class="hub__countdown" id="hub-countdown">' +
            formatRemaining(TARGET_MS - Date.now()) +
          '</span>';
      }
    }

    function unlock(el) {
      if (el.dataset.locked !== '1') return;
      delete el.dataset.locked;
      el.classList.remove('is-locked');
      el.removeAttribute('aria-disabled');
      el.removeAttribute('tabindex');
      const title = el.querySelector('.hub__watch-title');
      const sub   = el.querySelector('.hub__watch-sub');
      if (title) title.textContent = 'Watch Live Draft';
      if (sub)   sub.textContent   = 'See picks happen in real time';
    }

    let ticker = null;
    function tick() {
      const card = document.querySelector('.hub__watch');
      if (!card) return;
      const remaining = TARGET_MS - Date.now();
      if (remaining <= 0) {
        unlock(card);
        if (ticker) { clearInterval(ticker); ticker = null; }
        return;
      }
      lock(card);
      const out = document.getElementById('hub-countdown');
      if (out) out.textContent = formatRemaining(remaining);
    }

    function startWatching() {
      const hub = document.getElementById('team-view-hub');
      if (!hub) return;
      const tryApply = () => {
        if (!hub.querySelector('.hub__watch')) return false;
        tick();
        if (!ticker) ticker = setInterval(tick, 1000);
        return true;
      };
      // Try once now (in case hub is already rendered)
      if (tryApply()) return;
      // Otherwise watch for renderHub() to inject the markup
      const obs = new MutationObserver(() => { if (tryApply()) obs.disconnect(); });
      obs.observe(hub, { childList: true, subtree: true });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startWatching);
    } else {
      startWatching();
    }
  })();
</script>

</body>
</html>
