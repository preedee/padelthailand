<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/competitions/">
  <title>TPS Community Cup — Bangkok</title>
  <meta property="og:title" content="TPS Community Cup — Bangkok · 23 May 2026">
  <meta property="og:description" content="Live standings, brackets, and match results for the Bangkok Community Cup">
  <meta property="og:image" content="https://padelthailand.com/assets/cc-logo.png">
  <meta property="og:type" content="website">
  <link rel="icon" href="/assets/tps-favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css" />
  <link rel="stylesheet" href="css/styles.css?v=227">
  <link rel="stylesheet" href="css/cc-groups.css?v=4">
  <style>
    /* Hide the Upcoming Matches sidebar on the All Matches, Main Draw,
       Consolation, and Groups tabs so their content spans full width. Scoped to
       this page only — the shared engine keeps the sidebar on other competitions. */
    .content-area:has(#view-matches.active) .sidebar,
    .content-area:has(#view-bracket.active) .sidebar,
    .content-area:has(#view-consolation.active) .sidebar,
    .content-area:has(#view-groups.active) .sidebar { display: none; }

    /* Centered QR linking to this dashboard (scoped to this page). The shared
       footer is a fixed 44px space-between bar; grow it and absolutely-center
       the QR so it stays centered regardless of the side items' widths. */
    .footer { position: relative; height: auto; min-height: 78px; }
    .footer__qr {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      text-decoration: none;
    }
    .footer__qr img { width: 58px; height: 58px; display: block; border-radius: 3px; }
    .footer__qr-label {
      font-family: var(--font); font-weight: 400; font-size: 10px;
      letter-spacing: 1px; text-transform: uppercase; color: #C8D6CE;
    }
  </style>
  <script>window.__SHEET_ID = '1ZvTjeu-rgNFGG5lX-DY5k8riy_ezPIAtcSNr5BjY4DQ';</script>
</head>
<body>
  <!-- Rec #12 — dark event-day theme. Scoped to this Bangkok Community
       Cup landing only; other tournament hubs use the default light theme. -->
  <div class="dashboard theme-draft-live">

    <!-- Header -->
    <header class="header">
      <a href="#" class="header__left header__home-link" id="home-link">
        <img src="assets/lps-logo.jpeg" alt="Event Logo" class="header__lps-logo">
      </a>
      <div class="header__title">
        <h1>Tournament</h1>
        <p>Dashboard</p>
      </div>
      <div class="header__right">
        <img src="assets/tps-logo-green.png" alt="Partner Logo" class="header__tps-logo">
      </div>
    </header>

    <!-- View Indicator Bar (generated dynamically) -->
    <nav class="view-bar" id="view-bar"></nav>

    <!-- Content Area: Main + Sidebar -->
    <div class="content-area">
      <!-- Main Content (views generated dynamically) -->
      <main class="main-content" id="main-content">
        <section class="view active" id="view-loading">
          <div class="loading">Loading tournament data...</div>
        </section>
      </main>

      <!-- Sidebar: Upcoming Matches (always visible) -->
      <aside class="sidebar" id="sidebar-upcoming">
        <div class="sidebar__title">Upcoming Matches</div>
        <div class="sidebar__content">
          <div class="loading">Loading...</div>
        </div>
      </aside>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer__powered">
        <img src="/assets/favicon.png" alt="The Padel Society" class="footer__tps-logo">
        <span class="footer__powered-text">Powered by The Padel Society</span>
      </div>
      <a class="footer__qr" href="https://padelthailand.com/competitions/tps-may2026/" title="Scan to open this dashboard">
        <img src="assets/qr-tps-may2026.svg" alt="QR code linking to this dashboard">
        <span class="footer__qr-label">Scan for live scores</span>
      </a>
      <span class="footer__timestamp" id="last-updated">Last updated: --</span>
    </footer>

  </div>

  <script src="js/data.js?v=219"></script>
  <script src="js/standings.js?v=203"></script>
  <script src="js/matches.js?v=229"></script>
  <script src="js/bracket.js?v=203"></script>
  <script src="js/series.js?v=206"></script>
  <script src="js/cc-standings.js?v=203"></script>
  <script src="js/cc-live.js?v=203"></script>
  <script src="js/team-card.js?v=83"></script>
  <script src="js/cc-groups.js?v=1"></script>
  <script src="js/app.js?v=208"></script>
</body>
</html>
