<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/competitions/">
  <title>Pad Thai Padel — NOX Challenger</title>
  <meta property="og:title" content="Pad Thai Padel — NOX Challenger">
  <meta property="og:description" content="Live tournament standings, brackets, and match results">
  <meta property="og:image" content="https://padelthailand.com/assets/nox-jun2026-preview.png">
  <meta property="og:type" content="website">
  <link rel="icon" href="/assets/tps-favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css" />
  <link rel="stylesheet" href="css/styles.css?v=233">
  <style>
    /* NOX-only cosmetic overrides (per-competition; keeps shared engine CSS intact).
       Nav + footer text scale with viewport height (clamped), matching the
       dynamic standings sizing. ~1080px-tall ≈ the previous fixed sizes. */
    #view-bar .view-bar__tab { font-size: clamp(14px, 1.85vh, 24px); }
    #view-bar .view-bar__tab.active { font-size: clamp(15px, 2vh, 26px); }
    .footer { height: clamp(44px, 5.2vh, 64px); }
    .footer__powered-text, .footer__timestamp { font-size: clamp(12px, 1.7vh, 22px); }
    .footer__qr-label { font-size: clamp(10px, 1.3vh, 16px); }

    /* Brackets + All Matches: same viewport-height scaling as Standings.
       Gated to >=1024px so mobile keeps the engine's own tiers. 1080px ~= prior sizes. */
    @media (min-width: 1024px) {
      /* Gold/Silver bracket pages */
      .bracket-division__title       { font-size: clamp(13px, 1.7vh, 22px); }
      .bracket__round-title          { font-size: clamp(15px, 2vh, 26px); } /* match Standings group-name */
      .bracket-match__datetime       { font-size: clamp(11px, 1.3vh, 18px); }
      .bracket-match__score,
      .bracket-match__set            { font-size: clamp(12px, 1.5vh, 20px); }
      .team-stacked__place           { font-size: clamp(9px, 1vh, 14px); }
      /* All Matches court grid */
      .court-column__header          { font-size: clamp(15px, 2vh, 26px); } /* match Standings group-name */
      .match-card__round,
      .match-card__division,
      .match-card__round-name        { font-size: clamp(11px, 1.3vh, 18px); }
      .match-card__time              { font-size: clamp(10px, 1.2vh, 16px); }
      .match-card__on-court          { font-size: clamp(11px, 1.4vh, 19px); }

      /* Team names + avatars on brackets & All Matches match the Standings page
         exactly (team-stacked is used by both views; standings uses .team-name
         at clamp(15px,2.1vh,28px) and avatars at clamp(32px,4vh,44px)). */
      .bracket-match__team-name,
      .team-stacked__name,
      .team-stacked__standing-team,
      .match-card__team-name         { font-size: clamp(15px, 2.1vh, 28px); }
      .team-stacked .avatar,
      .bracket-match .avatar,
      .match-card .team-with-avatars .avatar {
        width: clamp(32px, 4vh, 44px) !important;
        height: clamp(32px, 4vh, 44px) !important;
        min-width: clamp(32px, 4vh, 44px); min-height: clamp(32px, 4vh, 44px);
      }
      .team-stacked .avatar--fallback,
      .bracket-match .avatar--fallback,
      .match-card .team-with-avatars .avatar--fallback {
        width: clamp(32px, 4vh, 44px) !important;
        height: clamp(32px, 4vh, 44px) !important;
        font-size: clamp(14px, 1.8vh, 21px) !important;
      }
      /* Flag badge size matches the Standings tab (24x17) on All Matches +
         knockout brackets, so avatars AND flags are identical across pages. */
      .team-stacked .avatar-flag__badge,
      .bracket-match .avatar-flag__badge,
      .match-card .team-with-avatars .avatar-flag__badge {
        width: 24px; height: 17px;
      }
      /* Bracket teams on a single line (match Standings / All Matches): the
         engine default lets long names wrap onto a second row — keep one line. */
      .bracket-match .team-with-avatars { min-width: 0; flex: 1; }
      .bracket-match__team-name {
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      /* Inline consolation = a smaller bracket beneath the knockout */
      .bracket-consolation--inline .bracket-match__team-name {
        font-size: clamp(12px, 1.6vh, 20px) !important;
      }
      .bracket-consolation--inline .bracket__round-title {
        font-size: clamp(10px, 1.1vh, 15px) !important;
      }
      .bracket-consolation--inline .bracket-match .avatar,
      .bracket-consolation--inline .bracket-match .avatar--fallback {
        width: clamp(20px, 2.4vh, 28px) !important;
        height: clamp(20px, 2.4vh, 28px) !important;
        min-width: clamp(20px, 2.4vh, 28px); min-height: clamp(20px, 2.4vh, 28px);
        font-size: clamp(10px, 1.3vh, 15px) !important;
      }
      /* Inline consolation has smaller avatars → keep its flag proportional. */
      .bracket-consolation--inline .bracket-match .avatar-flag__badge {
        width: 16px; height: 11px;
      }
      /* Cards the same WIDTH as the knockout. The consolation bracket has only 2
         round columns, which (flex:1) each stretched to ~50% → double-wide cards.
         Constrain to the knockout column width (25%), left-aligned. Stays compact
         (heights/fonts above unchanged) so the page still fits one screen. */
      .bracket-consolation--inline .bracket { justify-content: flex-start; }
      .bracket-consolation--inline .bracket__round { flex: 0 0 25%; }
    }
  </style>
  <script>window.__SHEET_ID = '1CgZLF17nKh9FhqNGci2WFlJnFZGHPDo5DwtkR1ICAb8';</script>
</head>
<body>
  <div class="dashboard">
    <header class="header">
      <a href="#" class="header__left header__home-link" id="home-link">
        <img src="/assets/monogram-white-on-green.png" alt="Event Logo" class="header__lps-logo">
      </a>
      <div class="header__title">
        <h1>Tournament</h1>
        <p>Dashboard</p>
      </div>
      <div class="header__right">
        <img src="/assets/tps-logo-green-on-white.png" alt="Partner Logo" class="header__tps-logo">
      </div>
    </header>
    <nav class="view-bar" id="view-bar"></nav>
    <div class="content-area">
      <main class="main-content" id="main-content">
        <section class="view active" id="view-loading">
          <div class="loading">Loading tournament data...</div>
        </section>
      </main>
      <aside class="sidebar" id="sidebar-upcoming">
        <div class="sidebar__title">Upcoming Matches</div>
        <div class="sidebar__content">
          <div class="loading">Loading...</div>
        </div>
      </aside>
    </div>
    <footer class="footer">
      <div class="footer__powered">
        <img src="/assets/favicon.png" alt="The Padel Society" class="footer__tps-logo">
        <span class="footer__powered-text">Powered by The Padel Society</span>
      </div>
      <span class="footer__timestamp" id="last-updated">Last updated: --</span>
    </footer>
  </div>
  <script src="js/data.js?v=235"></script>
  <script src="js/standings.js?v=227"></script>
  <script src="js/matches.js?v=234"></script>
  <script src="js/bracket.js?v=234"></script>
  <script src="js/app.js?v=232"></script>
</body>
</html>
