<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/competitions/">
  <title>Pad Thai Padel — NOX Challenger</title>
  <meta property="og:title" content="Pad Thai Padel — NOX Challenger">
  <meta property="og:description" content="Live tournament standings, brackets, and match results">
  <meta property="og:image" content="https://padelthailand.com/assets/nox-jun2026-preview.png">
  <meta property="og:type" content="website">
  <link rel="icon" href="/assets/tps-favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css" />
  <link rel="stylesheet" href="css/styles.4a6b208887.css">
  <style>
    /* NOX-only cosmetic overrides (per-competition; keeps shared engine CSS intact).
       Nav + footer text scale with viewport height (clamped), matching the
       dynamic standings sizing. ~1080px-tall ≈ the previous fixed sizes. */

    /* ===== Unified NOX type scale =====
       One font size per role, shared by Standings, All Matches and Brackets so
       equivalent text is identical everywhere. Sizes scale with viewport height
       (clamped); values ≈ the listed px on a 1080p-tall screen. */
    :root {
      --fs-title: clamp(15px, 2.0vh, 26px); /* section / group / court / division / round titles  ~22px */
      --fs-name:  clamp(15px, 2.1vh, 28px); /* team & player names                                ~23px */
      --fs-meta:  clamp(13px, 1.7vh, 22px); /* labels, dates/TIMES, column headers, scores        ~18px */
      --fs-small: clamp(11px, 1.4vh, 17px); /* small print: medal place, on-court badge           ~15px */
    }

    #view-bar .view-bar__tab { font-size: clamp(14px, 1.85vh, 24px); }
    #view-bar .view-bar__tab.active { font-size: clamp(15px, 2vh, 26px); }
    .footer { height: clamp(56px, 8vh, 84px); } /* grown to fit the doubled QR */
    .footer__powered-text, .footer__timestamp { font-size: clamp(12px, 1.7vh, 22px); }
    .footer__qr-label { font-size: clamp(10px, 1.3vh, 16px); }
    /* Doubled QR (shared CSS = 36px); scales with viewport height, caps at 72px. */
    .footer__qr img { width: clamp(48px, 6.8vh, 72px); height: clamp(48px, 6.8vh, 72px); }

    /* Bracket section labels ("KNOCKOUT" / "CONSOLATION") as a centered filled
       pill — white text on the brand colour. Defined at top level (NOT inside the
       desktop @media) so the pill also shows on mobile/tablet, not just ≥1024px. */
    .bracket-section__label {
      display: block;
      width: -moz-fit-content;
      width: fit-content;
      margin: 0 auto 6px;
      padding: 3px 26px;
      background: var(--green);
      color: #fff;
      border-radius: 999px;
      text-align: center;
      font: 700 var(--fs-title)/1.25 var(--font, inherit);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Brackets + All Matches: same viewport-height scaling as Standings.
       Gated to >=1024px so mobile keeps the engine's own tiers. 1080px ~= prior sizes. */
    @media (min-width: 1024px) {
      /* ---- Font sizes mapped onto the shared type scale (above) ----
         Equivalent text is now one size across Standings / All Matches / Brackets. */

      /* T1 titles — section / court / division / bracket round headers */
      .bracket-division__title,
      .bracket__round-title,
      .court-column__header          { font-size: var(--fs-title); }

      /* T2 names — team & player names. Winner/loser keep the same SIZE (the
         engine shrinks them to 13–17px, which clashed with the 23px elsewhere);
         emphasis stays via the engine's font-weight/opacity. */
      .bracket-match__team-name,
      .team-stacked__name,
      .team-stacked__standing-team,
      .match-card__team-name,
      .match-card__team--winner .match-card__team-name,
      .match-card__team--loser .match-card__team-name { font-size: var(--fs-name); }

      /* T3 meta — labels, dates/TIMES, scores, standings column headers.
         The match/bracket TIMES were the smallest text on every page (~13px);
         they now share this readable meta tier (~18px). */
      .bracket-match__datetime,
      .bracket-match__score,
      .bracket-match__set,
      .match-card__round,
      .match-card__division,
      .match-card__round-name,
      .match-card__time,
      .match-card__scores,
      .standings-divisions--combined .group-card__table th:not(.group-card__name) { font-size: var(--fs-meta); }

      /* T4 small — medal place + on-court badge */
      .team-stacked__place,
      .match-card__on-court          { font-size: var(--fs-small); }
      .team-stacked .avatar,
      .bracket-match .avatar,
      .match-card .team-with-avatars .avatar {
        width: clamp(32px, 4vh, 44px) !important;
        height: clamp(32px, 4vh, 44px) !important;
        min-width: clamp(32px, 4vh, 44px); min-height: clamp(32px, 4vh, 44px);
      }
      .team-stacked .avatar--fallback,
      .bracket-match .avatar--fallback,
      .match-card .team-with-avatars .avatar--fallback {
        width: clamp(32px, 4vh, 44px) !important;
        height: clamp(32px, 4vh, 44px) !important;
        font-size: clamp(14px, 1.8vh, 21px) !important;
      }
      /* Flag badge size, consistent across All Matches + knockout brackets +
         Standings. Reduced ~16% (24x17 -> 20x14) per request — flags read a
         touch smaller relative to the avatars. BLACK outline (was white) so
         light flags (e.g. Japan: white field) stay distinct from the card. */
      .team-stacked .avatar-flag__badge,
      .bracket-match .avatar-flag__badge,
      .match-card .team-with-avatars .avatar-flag__badge,
      .standings-divisions--combined .avatar-flag__badge {
        width: 20px; height: 14px;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.7), 0 1px 2px rgba(0, 0, 0, 0.35);
      }
      /* Bracket teams on a single line (match Standings / All Matches): the
         engine default lets long names wrap onto a second row — keep one line. */
      .bracket-match .team-with-avatars { min-width: 0; flex: 1; }
      .bracket-match__team-name {
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      /* Inline consolation now mirrors the knockout's columns exactly (same
         number of flex:1 columns, with empty spacers where it has no match) so
         the rounds line up vertically — Consolation Semi-Finals sits directly
         under Knockout Semi-Finals, etc. No column override needed. */

      /* Consolation columns have no round titles now → no need to reserve the
         title row of space at the top of each column. */
      .bracket-consolation--inline .bracket__matches { padding-top: 4px; }

      /* Match time (only shown when there's no score yet) sits out of flow,
         vertically centered on the right with a white background so the divider
         line between the two team rows doesn't show through it. */
      .bracket-match__datetime {
        position: absolute; top: 50%; right: 10px; transform: translateY(-50%);
        margin: 0; padding: 1px 6px; line-height: 1;
        background: #fff; border-radius: 3px;
      }
      /* Fit the knockout + the full-size consolation on ONE screen (no scroll).
         With the time out of flow the cards need far less squeezing, so spacing
         is comfortable again. Fonts, avatars and flags stay full-size. */
      /* Bracket view is a flex column. The knockout + consolation sections GROW
         to fill the height, and their match columns distribute the cards
         vertically (engine .bracket__matches uses justify-content:space-around),
         so the cards spread out to fill the page instead of bunching at the top.
         Knockout gets ~2× the consolation's share (it has more rounds/matches). */
      #view-gold-bracket, #view-silver-bracket { padding-top: 6px; padding-bottom: 4px; display: flex; flex-direction: column; }
      .view--with-consolation { gap: 4px; }
      /* Sections GROW to fill spare height (so cards spread out on Gold) but never
         SHRINK below their natural height (so the taller cards never overlap; the
         view scrolls instead when knockout + full consolation exceed one screen). */
      #view-gold-bracket > .bracket-single,
      #view-silver-bracket > .bracket-single { flex: 1 0 auto; }
      #view-gold-bracket .bracket-single > .bracket,
      #view-silver-bracket .bracket-single > .bracket { flex: 1; min-height: 0; }
      /* Provisional notice pinned to the very bottom; text matches the Standings
         legend size (--fs-meta). */
      .bracket-provisional { order: 99; font-size: var(--fs-meta); padding: 3px 12px; line-height: 1.25; }
      /* Knockout columns: clear the (now larger) round title so the first match
         card doesn't overlap it. Consolation has no titles → minimal top pad. */
      .bracket-single:not(.bracket-consolation--inline) .bracket__matches { padding-top: 26px; }
      .bracket-single .bracket-match { margin: 2px 0; }
      /* Knockout cards ~25% taller (roomier) via extra team-row padding. The
         consolation keeps the base height so the knockout + consolation still fit
         one screen on Silver. */
      .bracket-single:not(.bracket-consolation--inline) .bracket-match__team { padding: 9px 12px; min-height: 0; }
      .bracket-consolation--inline .bracket-match__team { padding: 3px 12px; min-height: 0; }
      /* Final Standings: trophy/medal + place text 2× bigger. */
      .team-stacked__standing .team-stacked__place { font-size: calc(var(--fs-small) * 2); }
    }

    /* ===== Standings table tweaks =====
       (1) Breathing room on the far-left (Team) and far-right (GD) columns so
           content isn't jammed against the card edges.
       (2) Stat columns MP/W/L/GD widened ~50% per responsive tier. */
    .group-card__table th:first-child,
    .group-card__table td:first-child { padding-left: 18px; }
    .group-card__table th:last-child,
    .group-card__table td:last-child  { padding-right: 18px; }

    .group-card__table th:not(:first-child) { width: 60px; }   /* base 40 → 60 */
    @media (min-width: 1024px) {
      .group-card__table th:not(:first-child) { width: 66px; } /* 44 → 66 */
    }
    @media (min-width: 1024px) and (min-height: 1000px) {
      .group-card__table th:not(:first-child) { width: 75px; } /* 50 → 75 (1080p TV) */
    }
    @media (max-width: 767px) {
      /* Phones: the MP/W/L/GD columns were 57px each (~228px total), squeezing
         the team names. Tighten them so names get the room. Single digits / a
         "-10" GD fit comfortably in 32px. */
      .group-card__table th:not(:first-child),
      .group-card__table td:not(:first-child) {
        width: 32px; min-width: 32px; padding-left: 2px; padding-right: 2px;
      }
      /* Let the team-name column use all the freed space (engine caps it at
         180px on mobile); it still ellipsises rather than overflowing. */
      .group-card__table td:first-child { max-width: none; }
      .group-card__table th:first-child,
      .group-card__table td:first-child { padding-left: 10px; }
      .group-card__table th:last-child,
      .group-card__table td:last-child  { padding-right: 8px; }
    }

    /* (3) Taller standings rows for more vertical breathing room (combined view).
       Was clamp(40px,5vh,64px) ≈ 54px @1080 → bumped. Trim a little surrounding
       vertical space so the taller rows still fit one screen. */
    @media (min-width: 1024px) {
      .standings-divisions--combined .group-card__table td { height: clamp(46px, 6vh, 74px); }
      .standings-divisions--combined { gap: 12px; }
      .standings-divisions--combined .standings-grid { gap: 12px; }
      .standings-divisions--combined .standings-legend { margin-top: 2px; padding-top: 4px; }
      /* Bigger projector avatars in Standings (was ~43px). The ~65px row has
         spare height, so 56px fits cleanly WITHOUT growing rows → standings
         still fits one screen (verified at 1920×1080). Brackets are left at
         ~43px: the Silver bracket is already at the no-scroll limit. */
      .standings-divisions--combined .team-with-avatars .avatar,
      .standings-divisions--combined .team-with-avatars .avatar--fallback {
        width: clamp(40px, 5.2vh, 56px) !important;
        height: clamp(40px, 5.2vh, 56px) !important;
        min-width: clamp(40px, 5.2vh, 56px) !important;
        min-height: clamp(40px, 5.2vh, 56px) !important;
      }
      .standings-divisions--combined .team-with-avatars .avatar--fallback {
        font-size: clamp(18px, 2.4vh, 26px) !important;
      }
    }

    /* Footer QR: hide on phones/tablets. The QR is injected by data.js at its
       full 240×240 size and absolutely centered; on the LIVE site (older shared
       styles.css) it has no size cap or mobile-hide, so it renders huge and
       overlaps Home + Brackets. Scanning a QR with the same phone you're reading
       on is pointless anyway. Self-contained here so it's fixed regardless of
       which shared-CSS version is deployed. Desktop/projector keeps the QR. */
    @media (max-width: 768px) {
      .footer__qr { display: none !important; }
    }

    /* ============================================================
       MOBILE (≤768px) — NOX-only mobile refinements.
       Matches the shared engine's own mobile breakpoint (≤768px) — using
       430px here previously meant large phones (e.g. iPhone Pro Max ~440px
       CSS-wide) fell through and got none of these fixes. Scoped to this
       nox-only shell so Community Cup / shared engine are intact.
       ============================================================ */
    @media (max-width: 768px) {

      /* ---- Header: the long tournament title was colliding with the
         left event logo and right partner logo. Shrink both logos,
         tighten padding, and let the title use the center column and
         wrap to (at most) two lines instead of overrunning the rails. */
      .header { padding: 6px 10px; height: auto; min-height: 50px; column-gap: 8px; }
      .header__lps-logo, .header__rpa-logo { height: 32px; }
      .header__tps-logo { height: 28px; }
      .header__title h1 {
        font-size: 13px; line-height: 1.12; letter-spacing: 0.3px;
        white-space: normal; overflow-wrap: anywhere;
      }
      .header__title p { font-size: 9px; letter-spacing: 0.5px; margin-top: 1px; }

      /* ---- Brackets: keep the engine's default HORIZONTAL-SCROLL layout
         (rounds side-by-side, swipe to reach the Final) — per user preference.
         We previously stacked rounds vertically, but the horizontal scroll is
         preferred. No override here. ---- */

      /* ---- All Matches: keep the engine's original per-court layout (the
         "old layout" — court headers + readable cards). With 3 courts they
         can't fit a phone without overlapping, so the cards stay full-size and
         the courts scroll horizontally (engine ≤768 default). No override here. */

      /* ---- Bigger player avatars on mobile (were 26px from the JS width attr,
         too small to recognise faces). 40px across Standings / All Matches /
         Brackets. The projector tier (≥1024px) is SEPARATE and unaffected — it
         stays at its tuned ~43px (already at the no-scroll limit). Mobile scrolls,
         so the taller row is fine. ---- */
      .team-with-avatars .avatar,
      .team-with-avatars .avatar--fallback,
      .bracket-match .avatar,
      .bracket-match .avatar--fallback,
      .match-card .team-with-avatars .avatar,
      .match-card .team-with-avatars .avatar--fallback {
        width: 40px !important; height: 40px !important;
        min-width: 40px !important; min-height: 40px !important;
      }
      .team-with-avatars .avatar--fallback,
      .bracket-match .avatar--fallback,
      .match-card .team-with-avatars .avatar--fallback { font-size: 18px !important; }
      /* a little more row height so the 40px avatars breathe in standings */
      .standings-divisions--combined .group-card__table td { height: 50px; }

      /* ---- Footer: pin the brown footer to the very bottom of the screen,
         BENEATH the black bottom-nav (footer is the bottom-most element; the
         nav sits directly on top of it). The QR is hidden on phones, so the
         footer is just the "Powered by / Last updated" line. ---- */
      .footer {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 101;
        height: 44px; min-height: 44px; margin-bottom: 0; padding: 8px 16px;
      }
      /* Lift the bottom nav to rest directly above the fixed footer. */
      .view-bar { bottom: 44px; }
      /* Keep scrollable views clear of the stacked nav (~52px) + footer (44px). */
      .view.active { padding-bottom: 104px; }

      /* ---- Home: center the logo in the area above the fixed nav + footer
         (header ~50 + nav ~52 + footer 44). The footer no longer lives in
         flow here — it's pinned above. ---- */
      #view-home { padding: 0; }
      #view-home .home-page {
        height: auto;
        min-height: calc(100dvh - 146px);
        justify-content: center;
        padding: 24px;
      }
    }
  </style>
  <script>window.__SHEET_ID = '1CgZLF17nKh9FhqNGci2WFlJnFZGHPDo5DwtkR1ICAb8';</script>
</head>
<body>
  <div class="dashboard">
    <header class="header">
      <a href="#" class="header__left header__home-link" id="home-link">
        <img src="/assets/monogram-white-on-green.png" alt="Event Logo" class="header__lps-logo">
      </a>
      <div class="header__title">
        <h1>Tournament</h1>
        <p>Dashboard</p>
      </div>
      <div class="header__right">
        <img src="/assets/tps-logo-green-on-white.png" alt="Partner Logo" class="header__tps-logo">
      </div>
    </header>
    <nav class="view-bar" id="view-bar"></nav>
    <div class="content-area">
      <main class="main-content" id="main-content">
        <section class="view active" id="view-loading">
          <div class="loading">Loading tournament data...</div>
        </section>
      </main>
      <aside class="sidebar" id="sidebar-upcoming">
        <div class="sidebar__title">Upcoming Matches</div>
        <div class="sidebar__content">
          <div class="loading">Loading...</div>
        </div>
      </aside>
    </div>
    <footer class="footer">
      <div class="footer__powered">
        <img src="/assets/favicon.png" alt="The Padel Society" class="footer__tps-logo">
        <span class="footer__powered-text">Powered by The Padel Society</span>
      </div>
      <span class="footer__timestamp" id="last-updated">Last updated: --</span>
    </footer>
  </div>
  <script src="js/data.194099816c.js"></script>
  <script src="js/standings.d151844ce0.js"></script>
  <script src="js/matches.5baaee3648.js"></script>
  <script src="js/bracket.4039b6ce7e.js"></script>
  <script src="js/app.cde7e8be3b.js"></script>
</body>
