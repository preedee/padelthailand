<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/competitions/">
  <title>Pad Thai Padel — NOX Challenger</title>
  <meta property="og:title" content="Pad Thai Padel — NOX Challenger">
  <meta property="og:description" content="Live tournament standings, brackets, and match results">
  <meta property="og:image" content="https://padelthailand.com/assets/nox-jun2026-preview.png">
  <meta property="og:type" content="website">
  <link rel="icon" href="/assets/tps-favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css" />
  <link rel="stylesheet" href="css/styles.9be76abc6c.css">
  <style>
    /* NOX-only cosmetic overrides (per-competition; keeps shared engine CSS intact).
       Nav + footer text scale with viewport height (clamped), matching the
       dynamic standings sizing. ~1080px-tall ≈ the previous fixed sizes. */

    /* ===== Unified NOX type scale =====
       One font size per role, shared by Standings, All Matches and Brackets so
       equivalent text is identical everywhere. Sizes scale with viewport height
       (clamped); values ≈ the listed px on a 1080p-tall screen. */
    :root {
      --fs-title: clamp(15px, 2.0vh, 26px); /* section / group / court / division / round titles  ~22px */
      --fs-name:  clamp(15px, 2.1vh, 28px); /* team & player names                                ~23px */
      --fs-meta:  clamp(13px, 1.7vh, 22px); /* labels, dates/TIMES, column headers, scores        ~18px */
      --fs-small: clamp(11px, 1.4vh, 17px); /* small print: medal place, on-court badge           ~15px */
    }

    #view-bar .view-bar__tab { font-size: clamp(14px, 1.85vh, 24px); }
    #view-bar .view-bar__tab.active { font-size: clamp(15px, 2vh, 26px); }
    .footer { height: clamp(56px, 8vh, 84px); } /* grown to fit the doubled QR */
    .footer__powered-text, .footer__timestamp { font-size: clamp(12px, 1.7vh, 22px); }
    .footer__qr-label { font-size: clamp(10px, 1.3vh, 16px); }
    /* Doubled QR (shared CSS = 36px); scales with viewport height, caps at 72px. */
    .footer__qr img { width: clamp(48px, 6.8vh, 72px); height: clamp(48px, 6.8vh, 72px); }

    /* Light/dark theme toggle — lives in the FOOTER (brand brown in both themes),
       so a translucent white circular button reads well either way. */
    .footer__timestamp { display: none !important; }   /* "Last updated" removed */
    .nox-theme-toggle {
      flex: 0 0 auto;
      width: 32px; height: 32px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.55);
      background: rgba(255,255,255,0.14);
      color: #fff; font-size: 17px; line-height: 1; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0; transition: background 0.2s ease;
    }
    .nox-theme-toggle:hover { background: rgba(255,255,255,0.26); }
    @media (max-width: 768px) {
      .nox-theme-toggle { width: 30px; height: 30px; font-size: 16px; }
    }

    /* Bracket section labels ("KNOCKOUT" / "CONSOLATION") as a centered filled
       pill — white text on the brand colour. Defined at top level (NOT inside the
       desktop @media) so the pill also shows on mobile/tablet, not just ≥1024px. */
    .bracket-section__label {
      display: block;
      width: -moz-fit-content;
      width: fit-content;
      margin: 0 auto 6px;
      padding: 3px 26px;
      background: var(--green);
      color: #fff;
      border-radius: 999px;
      text-align: center;
      font: 700 var(--fs-title)/1.25 var(--font, inherit);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* ===== Silver bracket KNOCKOUT / CONSOLATION toggle =====
       Silver has two brackets (knockout + consolation). Instead of stacking them
       (which crammed the cards), show ONE at a time via a pill toggle bar — so the
       knockout renders in the same single-bracket format as Gold (and at 50px).
       The toggle bar is injected + kept alive by the inline script at the bottom;
       the active-tab state is a class on #view-silver-bracket (survives the 30s
       poll re-render). Default = knockout. */
    #view-silver-bracket .bracket-section__label,
    #view-silver-bracket .bracket-consolation__label { display: none !important; }
    .nox-silver-toggle {
      display: flex; gap: 12px; justify-content: center; margin: 0 auto 8px;
    }
    .nox-silver-toggle .nox-pill {
      font: 700 var(--fs-title, 18px)/1.25 var(--font, inherit);
      letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      padding: 3px 26px; border-radius: 999px;
      background: transparent; color: var(--green); border: 2px solid var(--green);
    }
    .nox-silver-toggle .nox-pill.active { background: var(--green); color: #fff; }
    /* Default: knockout shown, consolation hidden. */
    #view-silver-bracket .bracket-consolation--inline { display: none; }
    #view-silver-bracket.nox-show-consolation .bracket-single:not(.bracket-consolation--inline) { display: none; }
    #view-silver-bracket.nox-show-consolation .bracket-consolation--inline { display: flex; }

    /* Gold's single "Knockout" pill must match the Silver toggle bar's box so the
       round labels land at the EXACT same Y when switching Gold ↔ Silver. (2px
       border to match the toggle pills' border; 12px bottom margin matches the
       toggle bar's total height + 8px margin.) */
    #view-gold-bracket .bracket-section__label { border: 2px solid var(--green); margin: 0 auto 12px; }
    /* Silver consolation shows ALONE now (toggle), not stacked under the knockout,
       so drop the inline-stack separator border + 0.8vh top padding — that was
       pushing its round labels ~10px below the knockout's. */
    #view-silver-bracket .bracket-consolation--inline { border-top: none; padding-top: 0; }

    /* Flag-badge outline — BLACK ring (overrides the engine's white) so light
       flags (e.g. Japan) stay distinct. UNSCOPED on purpose: it must apply at
       every width. The badge SIZE override lives in the >=1024px block (it is
       tied to the 50px projector avatars); only the colour belongs here. */
    .team-stacked .avatar-flag__badge,
    .bracket-match .avatar-flag__badge,
    .match-card .team-with-avatars .avatar-flag__badge,
    .standings-divisions--combined .avatar-flag__badge {
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.7), 0 1px 2px rgba(0, 0, 0, 0.35);
    }

    /* Brackets + All Matches: same viewport-height scaling as Standings.
       Gated to >=1024px so mobile keeps the engine's own tiers. 1080px ~= prior sizes. */
    @media (min-width: 1024px) {
      /* ---- Font sizes mapped onto the shared type scale (above) ----
         Equivalent text is now one size across Standings / All Matches / Brackets. */

      /* T1 titles — section / court / division / bracket round headers */
      .bracket-division__title,
      .bracket__round-title,
      .court-column__header          { font-size: var(--fs-title); }

      /* T2 names — team & player names. Winner/loser keep the same SIZE (the
         engine shrinks them to 13–17px, which clashed with the 23px elsewhere);
         emphasis stays via the engine's font-weight/opacity. */
      .bracket-match__team-name,
      .team-stacked__name,
      .team-stacked__standing-team,
      .match-card__team-name,
      .match-card__team--winner .match-card__team-name,
      .match-card__team--loser .match-card__team-name { font-size: var(--fs-name); }

      /* T3 meta — labels, dates/TIMES, scores, standings column headers.
         The match/bracket TIMES were the smallest text on every page (~13px);
         they now share this readable meta tier (~18px). */
      .bracket-match__datetime,
      .bracket-match__score,
      .bracket-match__set,
      .match-card__round,
      .match-card__division,
      .match-card__round-name,
      .match-card__time,
      .match-card__scores,
      .standings-divisions--combined .group-card__table th:not(.group-card__name) { font-size: var(--fs-meta); }

      /* T4 small — medal place + on-court badge */
      .team-stacked__place,
      .match-card__on-court          { font-size: var(--fs-small); }
      /* Projector avatars: 50px everywhere (Standings, All Matches, Brackets).
         Silver now shows ONE bracket at a time via the KNOCKOUT/CONSOLATION toggle
         (see below), so it has the same room as Gold and 50px fits comfortably. */
      .match-card .team-with-avatars .avatar,
      .team-stacked .avatar,
      .bracket-match .avatar {
        width: 50px !important;
        height: 50px !important;
        min-width: 50px !important; min-height: 50px !important;
      }
      .match-card .team-with-avatars .avatar--fallback,
      .team-stacked .avatar--fallback,
      .bracket-match .avatar--fallback {
        width: 50px !important;
        height: 50px !important;
        font-size: 24px !important;
      }
      /* Comfortable bracket spacing (each bracket shows alone now): round title
         clears the first card, cards have a real gap. */
      .bracket-single:not(.bracket-consolation--inline) .bracket-match__team { padding: 6px 12px !important; }
      .bracket-consolation--inline .bracket-match__team { padding: 6px 12px !important; }
      .bracket-single:not(.bracket-consolation--inline) .bracket__matches { padding-top: 26px !important; }
      .bracket-single .bracket-match { margin: 4px 0 !important; }

      /* All Matches: cards 80% width (20% narrower) so the score isn't so far
         right, and CENTERED in each court column. The court header + its bottom
         bar are matched to the same 80% width and centered so they line up with
         the cards. */
      #view-matches .match-card { width: 80%; max-width: 80%; margin: 0 auto; }
      #view-matches .court-column__header { width: 80%; margin: 0 auto; }
      /* Flag badge size: reduced ~16% (24x17 -> 20x14) per request — flags read
         a touch smaller relative to the 50px projector avatars. SIZE only is
         projector-scoped; the BLACK outline lives in an unscoped rule below so
         it applies on mobile too (see flag-badge-outline rule near the top). */
      .team-stacked .avatar-flag__badge,
      .bracket-match .avatar-flag__badge,
      .match-card .team-with-avatars .avatar-flag__badge,
      .standings-divisions--combined .avatar-flag__badge {
        width: 20px; height: 14px;
      }
      /* Bracket teams on a single line (match Standings / All Matches): the
         engine default lets long names wrap onto a second row — keep one line. */
      .bracket-match .team-with-avatars { min-width: 0; flex: 1; }
      .bracket-match__team-name {
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      /* Inline consolation now mirrors the knockout's columns exactly (same
         number of flex:1 columns, with empty spacers where it has no match) so
         the rounds line up vertically — Consolation Semi-Finals sits directly
         under Knockout Semi-Finals, etc. No column override needed. */

      /* Consolation now gets round titles injected by the toggle script (so the
         labels match the knockout's position) → reserve the same title-row space
         as the knockout (26px) so cards don't overlap the labels. */
      .bracket-consolation--inline .bracket__matches { padding-top: 26px; }

      /* Match time (only shown when there's no score yet) sits out of flow,
         vertically centered on the right with a white background so the divider
         line between the two team rows doesn't show through it. */
      .bracket-match__datetime {
        position: absolute; top: 50%; right: 10px; transform: translateY(-50%);
        margin: 0; padding: 1px 6px; line-height: 1;
        background: #fff; border-radius: 3px;
      }
      /* Fit the knockout + the full-size consolation on ONE screen (no scroll).
         With the time out of flow the cards need far less squeezing, so spacing
         is comfortable again. Fonts, avatars and flags stay full-size. */
      /* Bracket view is a flex column. The knockout + consolation sections GROW
         to fill the height, and their match columns distribute the cards
         vertically (engine .bracket__matches uses justify-content:space-around),
         so the cards spread out to fill the page instead of bunching at the top.
         Knockout gets ~2× the consolation's share (it has more rounds/matches). */
      #view-gold-bracket, #view-silver-bracket { padding-top: 6px; padding-bottom: 4px; display: flex; flex-direction: column; }
      .view--with-consolation { gap: 4px; }
      /* Sections GROW to fill spare height (so cards spread out on Gold) but never
         SHRINK below their natural height (so the taller cards never overlap; the
         view scrolls instead when knockout + full consolation exceed one screen). */
      #view-gold-bracket > .bracket-single,
      #view-silver-bracket > .bracket-single { flex: 1 0 auto; }
      #view-gold-bracket .bracket-single > .bracket,
      #view-silver-bracket .bracket-single > .bracket { flex: 1; min-height: 0; }
      /* Provisional notice pinned to the very bottom; text matches the Standings
         legend size (--fs-meta). */
      .bracket-provisional { order: 99; font-size: var(--fs-meta); padding: 3px 12px; line-height: 1.25; }
      /* Knockout columns: clear the (now larger) round title so the first match
         card doesn't overlap it. Consolation has no titles → minimal top pad. */
      .bracket-single:not(.bracket-consolation--inline) .bracket__matches { padding-top: 26px; }
      .bracket-single .bracket-match { margin: 2px 0; }
      /* Knockout cards ~25% taller (roomier) via extra team-row padding. The
         consolation keeps the base height so the knockout + consolation still fit
         one screen on Silver. */
      .bracket-single:not(.bracket-consolation--inline) .bracket-match__team { padding: 9px 12px; min-height: 0; }
      .bracket-consolation--inline .bracket-match__team { padding: 3px 12px; min-height: 0; }
      /* Final Standings: trophy/medal + place text 2× bigger. */
      .team-stacked__standing .team-stacked__place { font-size: calc(var(--fs-small) * 2); }
    }

    /* ===== Standings table tweaks =====
       (1) Breathing room on the far-left (Team) and far-right (GD) columns so
           content isn't jammed against the card edges.
       (2) Stat columns MP/W/L/GD widened ~50% per responsive tier. */
    .group-card__table th:first-child,
    .group-card__table td:first-child { padding-left: 18px; }
    .group-card__table th:last-child,
    .group-card__table td:last-child  { padding-right: 18px; }

    /* MP/W/L/GD: headers centered. MP/W/L values centered too; only GD values are
       right-aligned (it's the wider 2-digit ± column). */
    .group-card__table th:not(:first-child) { text-align: center; }
    .group-card__table td:not(:first-child) { text-align: center; }
    .group-card__table td:last-child:not(:first-child) { text-align: right; }

    .group-card__table th:not(:first-child) { width: 52px; }   /* MP/W/L/GD — single digits + a -10 GD */
    /* GD column ~20% wider — it can hold a 2-digit (±) value like -18. Higher
       specificity (:last-child:not(:first-child)) so it wins per tier. */
    .group-card__table th:last-child:not(:first-child),
    .group-card__table td:last-child:not(:first-child) { width: 62px; }
    @media (min-width: 1024px) {
      .group-card__table th:not(:first-child) { width: 50px; } /* tightened from 66 → more room for names */
      .group-card__table th:last-child:not(:first-child),
      .group-card__table td:last-child:not(:first-child) { width: 60px; }
    }
    @media (min-width: 1024px) and (min-height: 1000px) {
      .group-card__table th:not(:first-child) { width: 52px; } /* 1080p TV: tightened from 75 → names get the space */
      .group-card__table th:last-child:not(:first-child),
      .group-card__table td:last-child:not(:first-child) { width: 62px; }
    }
    @media (max-width: 767px) {
      /* Phones: the MP/W/L/GD columns were 57px each (~228px total), squeezing
         the team names. Tighten them so names get the room. Single digits / a
         "-10" GD fit comfortably in 32px. */
      .group-card__table th:not(:first-child),
      .group-card__table td:not(:first-child) {
        width: 32px; min-width: 32px; padding-left: 2px; padding-right: 2px;
      }
      /* GD ~20% wider here too (2-digit ± value). */
      .group-card__table th:last-child:not(:first-child),
      .group-card__table td:last-child:not(:first-child) { width: 38px; min-width: 38px; }
      /* Let the team-name column use all the freed space (engine caps it at
         180px on mobile); it still ellipsises rather than overflowing. */
      .group-card__table td:first-child { max-width: none; }
      .group-card__table th:first-child,
      .group-card__table td:first-child { padding-left: 10px; }
      .group-card__table th:last-child,
      .group-card__table td:last-child  { padding-right: 8px; }
    }

    /* (3) Taller standings rows for more vertical breathing room (combined view).
       Was clamp(40px,5vh,64px) ≈ 54px @1080 → bumped. Trim a little surrounding
       vertical space so the taller rows still fit one screen. */
    @media (min-width: 1024px) {
      .standings-divisions--combined .group-card__table td { height: clamp(46px, 6vh, 74px); }
      .standings-divisions--combined { gap: 12px; }
      .standings-divisions--combined .standings-grid { gap: 12px; }
      .standings-divisions--combined .standings-legend { margin-top: 2px; padding-top: 4px; }
      /* Standings projector avatars — consistent 50px to match brackets/matches.
         Fits cleanly inside the ~65px row without growing it. */
      .standings-divisions--combined .team-with-avatars .avatar,
      .standings-divisions--combined .team-with-avatars .avatar--fallback {
        width: 50px !important;
        height: 50px !important;
        min-width: 50px !important;
        min-height: 50px !important;
      }
      .standings-divisions--combined .team-with-avatars .avatar--fallback {
        font-size: 24px !important;
      }
    }

    /* Footer QR: hide on phones/tablets. The QR is injected by data.js at its
       full 240×240 size and absolutely centered; on the LIVE site (older shared
       styles.css) it has no size cap or mobile-hide, so it renders huge and
       overlaps Home + Brackets. Scanning a QR with the same phone you're reading
       on is pointless anyway. Self-contained here so it's fixed regardless of
       which shared-CSS version is deployed. Desktop/projector keeps the QR. */
    @media (max-width: 768px) {
      .footer__qr { display: none !important; }
    }

    /* ============================================================
       MOBILE (≤768px) — NOX-only mobile refinements.
       Matches the shared engine's own mobile breakpoint (≤768px) — using
       430px here previously meant large phones (e.g. iPhone Pro Max ~440px
       CSS-wide) fell through and got none of these fixes. Scoped to this
       nox-only shell so Community Cup / shared engine are intact.
       ============================================================ */
    @media (max-width: 768px) {

      /* ---- Header: the long tournament title was colliding with the
         left event logo and right partner logo. Shrink both logos,
         tighten padding, and let the title use the center column and
         wrap to (at most) two lines instead of overrunning the rails. */
      .header { padding: 6px 10px; height: auto; min-height: 50px; column-gap: 8px; }
      .header__lps-logo, .header__rpa-logo { height: 32px; }
      .header__tps-logo { height: 28px; }
      .header__title h1 {
        font-size: 13px; line-height: 1.12; letter-spacing: 0.3px;
        white-space: normal; overflow-wrap: anywhere;
      }
      .header__title p { font-size: 9px; letter-spacing: 0.5px; margin-top: 1px; }

      /* ---- Brackets: keep the engine's default HORIZONTAL-SCROLL layout
         (rounds side-by-side, swipe to reach the Final) — per user preference.
         We previously stacked rounds vertically, but the horizontal scroll is
         preferred. Widen the cards (engine mobile = 200px) so team names — esp.
         provisional seeds with the trailing * — fit without fragmenting; wrap at
         spaces, not mid-word. Bump the name font (engine mobile = 12px) so it's
         in proportion with the 40px avatars; widen columns to keep names on one
         line at the larger size. ---- */
      .bracket__round { min-width: 300px; }
      .bracket-match__team { font-size: 16px; }
      .bracket-match__team-name { word-break: normal; overflow-wrap: normal; font-size: 16px; line-height: 1.3; }

      /* ---- All Matches: match the BRACKET card scale for consistency (user
         preference). Bracket cards on mobile are ~300px wide with 16px names /
         15px scores and fit every name — so the All Matches per-court column is
         set to the same 300px and the same fonts. ~one court per phone screen
         (peek of the next), horizontal court-swipe kept; names still fit. */
      #view-matches .matches-grid,
      #view-matches .matches-grid__header-row { --court-min: 310px; }
      #view-matches .match-card__team-name,
      #view-matches .match-card__team--winner .match-card__team-name,
      #view-matches .match-card__team--loser .match-card__team-name { font-size: 16px; }
      #view-matches .match-card__set-score { font-size: 15px; }
      #view-matches .match-card__scores { gap: 4px; }   /* match bracket's tighter score gap */

      /* ---- Bigger player avatars on mobile (were 26px from the JS width attr,
         too small to recognise faces). 40px across Standings / All Matches /
         Brackets. The projector tier (≥1024px) is SEPARATE and unaffected — it
         stays at its tuned ~43px (already at the no-scroll limit). Mobile scrolls,
         so the taller row is fine. ---- */
      .team-with-avatars .avatar,
      .team-with-avatars .avatar--fallback,
      .bracket-match .avatar,
      .bracket-match .avatar--fallback,
      .match-card .team-with-avatars .avatar,
      .match-card .team-with-avatars .avatar--fallback {
        width: 40px !important; height: 40px !important;
        min-width: 40px !important; min-height: 40px !important;
      }
      .team-with-avatars .avatar--fallback,
      .bracket-match .avatar--fallback,
      .match-card .team-with-avatars .avatar--fallback { font-size: 18px !important; }
      /* a little more row height so the 40px avatars breathe in standings */
      .standings-divisions--combined .group-card__table td { height: 50px; }

      /* ---- Footer: pin the brown footer to the very bottom of the screen,
         BENEATH the black bottom-nav (footer is the bottom-most element; the
         nav sits directly on top of it). The QR is hidden on phones, so the
         footer is just the "Powered by / Last updated" line. ---- */
      .footer {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 101;
        height: 44px; min-height: 44px; margin-bottom: 0; padding: 8px 16px;
      }
      /* Lift the bottom nav to rest directly above the fixed footer. */
      .view-bar { bottom: 44px; }
      /* Keep scrollable views clear of the stacked nav (~52px) + footer (44px). */
      .view.active { padding-bottom: 104px; }

      /* ---- Home: center the logo in the area above the fixed nav + footer
         (header ~50 + nav ~52 + footer 44). The footer no longer lives in
         flow here — it's pinned above. ---- */
      #view-home { padding: 0; }
      #view-home .home-page {
        height: auto;
        min-height: calc(100dvh - 146px);
        justify-content: center;
        padding: 24px;
      }
    }

    /* ============================================================
       DARK "BROADCAST" THEME (whole dashboard) — Premier-Padel-inspired.
       The engine's .theme-dark (class added to .dashboard) handles the page
       bg, sidebar, footer, view titles and bracket cards (winner → gold).
       Below fills the gaps it doesn't cover (header, nav, standings table,
       match cards, court headers) and adds depth, connectors + a winner check.
       ============================================================ */

    /* Dark-theme accent = SILVER (was gold/yellow). Overriding --dark-accent
       re-colours everything that uses it (round titles, nav active tab, court
       headers, KNOCKOUT pill, winner text, champion, etc.). The few hardcoded
       rgba(194,200,208,…) accents are swapped to silver below. */
    .theme-dark { --dark-accent: #C2C8D0; }

    /* ---- Chrome the engine theme-dark misses ---- */
    .theme-dark .content-area,
    .theme-dark .view { background: var(--dark-bg, #0A1612); }
    /* #R2-1 Loading state: the engine's .loading text is a DARK GREEN
       (rgb 58,92,54) — on the near-black dark bg it was effectively invisible.
       Re-colour to muted light text so "Loading tournament data..." reads while
       data is being fetched. */
    .theme-dark .loading {
      color: var(--dark-text-muted, #9CA3AF) !important;
      text-align: center;
    }
    /* #R2-2 Dark scrollbars: the default light/system scrollbar (visible on the
       vertically-scrolling All Matches view and the horizontally-scrolling
       mobile bracket) breaks the broadcast look. Subtle dark track + muted thumb
       that brightens slightly on hover. WebKit (Chrome/Safari/projector kiosks)
       + Firefox (scrollbar-color). iOS uses auto-hiding overlay bars, unaffected. */
    .theme-dark .view,
    .theme-dark .bracket,
    .theme-dark .content-area {
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.18) transparent;
    }
    .theme-dark .view::-webkit-scrollbar,
    .theme-dark .bracket::-webkit-scrollbar,

    /* #1 Background depth: a VERY subtle Premier-style vignette + diagonal sheen

    .theme-dark .match-card--next {

    .theme-dark .match-card__on-court {

    /* #R2-3b LIVE match (blind-but-safe — no live match in current data, so this

       even more than the next-up card. */
    .theme-dark .match-card--live {
      border-color: #2ec27e !important;
      box-shadow: 0 0 0 2px rgba(46,194,126,0.45),

    @keyframes noxLivePulse {

      50%      { box-shadow: 0 0 0 2px rgba(46,194,126,0.75), 0 8px 30px rgba(46,194,126,0.34), 0 6px 18px rgba(0,0,0,0.45); }

    @media (prefers-reduced-motion: reduce) {
      .theme-dark .match-card--live { animation: none; }

    /* ============================================================
       TIER 4 — gold accents, champion glow-up, subtle motion.
       ============================================================ */
    /* #11 Champion (Final Standings): the 1st-place card gets a gold glow; the

      box-shadow: 0 0 0 1px rgba(194,200,208,0.25), 0 8px 22px rgba(194,200,208,0.12), 0 6px 18px rgba(0,0,0,0.45) !important;
    }
    .theme-dark .bracket-match--gold .team-stacked__place,

    .theme-dark .bracket-match--silver {

      background-image: linear-gradient(180deg, rgba(200,200,210,0.10), rgba(200,200,210,0)) !important;

    /* #12 Subtle motion: hover lift on cards (laptop viewing), and a fade-in when

  <!-- Silver KNOCKOUT/CONSOLATION toggle. Injects a pill bar into
       #view-silver-bracket and shows one bracket at a time. The active tab is a
       class on the (persistent) view element, so it survives bracket.js's poll
       re-renders; the bar itself is re-injected by a MutationObserver. Click is
       handled by delegation on document so it never needs re-binding. -->
  <script>
  /* #6 Mute true PLACEHOLDER labels so real names pop.
     The bracket engine renders empty slots as plain .bracket-match__team-name
     spans with text like "TBD", "Winner QF1", "Winner SF2", "Winner Cons SF1",
     "Seed A1". Real-but-pending teams (group still running) instead carry the
     --provisional modifier + a gold "*", and must stay BRIGHT. CSS can't match
     text, so tag the placeholders with a class and style it muted (var
     --dark-text-muted). Runs on load + on every bracket re-render. */
  (function () {
    var RE = /^(TBD|Winner\b|Loser\b|Seed\b)/i;
    function mark(root) {
      var spans = (root || document).querySelectorAll(
        '.bracket-match__team-name:not(.bracket-match__team-name--provisional)');
      [].forEach.call(spans, function (s) {
        var isPlaceholder = RE.test(s.textContent.trim());
        s.classList.toggle('nox-placeholder', isPlaceholder);
        // Also dim the two single-letter avatar "fallback" chips of a placeholder
        // row (e.g. "W"+"Q") so the whole slot recedes together.
        var row = s.closest ? s.closest('.bracket-match__team') : null;
        if (row) {
          [].forEach.call(row.querySelectorAll('.avatar--fallback'), function (a) {
            a.classList.toggle('nox-placeholder-avatar', isPlaceholder);
          });
        }
      });
    }
    /* Standings GD column: center the values when they're all single-character
       (e.g. all "0" before any matches are played) so the column matches the
       centered MP/W/L; right-align once a 2-digit/± value appears so the digits
       line up. Per group card. */
    function alignGD(root) {
      var tables = (root || document).querySelectorAll('.standings-divisions--combined .group-card__table');
      [].forEach.call(tables, function (t) {
        var gds = [].slice.call(t.querySelectorAll('tbody td:last-child'));
        if (!gds.length) return;
        var allShort = gds.every(function (td) { return td.textContent.trim().length <= 1; });
        gds.forEach(function (td) { td.style.textAlign = allShort ? 'center' : 'right'; });
      });
    }
    /* The engine renders the badge as "On<br>Court" (a hard line break), so CSS
       white-space:nowrap can't keep it on one line — swap the <br> for a space.
       Also vertically center the pill exactly on the divider line between the two
       team rows (the engine centers it on the teams-box midpoint, which sits a few
       px above the divider). Applies on mobile + desktop. */
    function fixOnCourt(root) {
      var pills = (root || document).querySelectorAll('.match-card__on-court');
      [].forEach.call(pills, function (o) {
        [].forEach.call(o.querySelectorAll('br'), function (br) { br.replaceWith(' '); });
      });
    }
    function start() {
      mark(document); alignGD(document); fixOnCourt(document);
      var content = document.getElementById('main-content') || document.body;
      new MutationObserver(function () { mark(document); alignGD(document); fixOnCourt(document); }).observe(content, { childList: true, subtree: true });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  })();
  </script>
  <script>
  (function () {
    var VIEW_ID = 'view-silver-bracket';

    // Give the consolation columns the same round-title labels as the knockout,
    // in the same column positions, so toggling doesn't move them and the
    // consolation isn't label-less. Reads the knockout's titles by column index.
    function labelConsolation(view) {
      var ko = view.querySelector('.bracket-single:not(.bracket-consolation--inline)');
      var co = view.querySelector('.bracket-consolation--inline');
      if (!ko || !co) return;
      var koTitles = [].map.call(ko.querySelectorAll('.bracket__round'), function (r) {
        var t = r.querySelector('.bracket__round-title'); return t ? t.textContent : '';
      });
      [].forEach.call(co.querySelectorAll('.bracket__round'), function (rd, i) {
        if (rd.querySelector('.bracket__round-title')) return;   // already labelled
        if (!rd.querySelector('.bracket-match')) return;         // empty spacer column → no label
        var label = koTitles[i];
        if (!label) return;
        var t = document.createElement('div');
        t.className = 'bracket__round-title';
        t.textContent = label;
        rd.insertBefore(t, rd.firstChild);
      });
    }

    function ensureBar() {
      var view = document.getElementById(VIEW_ID);
      if (!view) return;
      var consolation = view.querySelector('.bracket-consolation--inline');
      if (!view.querySelector('.bracket-single') || !consolation) return; // not rendered yet
      labelConsolation(view);
      if (view.querySelector('.nox-silver-toggle')) return;        // bar already present
      var showCons = view.classList.contains('nox-show-consolation');
      var bar = document.createElement('div');
      bar.className = 'nox-silver-toggle';
      bar.setAttribute('role', 'tablist');
      bar.innerHTML =
        '<button class="nox-pill' + (showCons ? '' : ' active') + '" data-nox-tab="knockout" role="tab">Knockout</button>' +
        '<button class="nox-pill' + (showCons ? ' active' : '') + '" data-nox-tab="consolation" role="tab">Consolation</button>';
      view.insertBefore(bar, view.firstChild);
    }

    // Click handling via delegation — survives every re-render.
    document.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('.nox-silver-toggle .nox-pill') : null;
      if (!btn) return;
      var view = document.getElementById(VIEW_ID);
      if (!view) return;
      var tab = btn.getAttribute('data-nox-tab');
      view.classList.toggle('nox-show-consolation', tab === 'consolation');
      view.querySelectorAll('.nox-silver-toggle .nox-pill').forEach(function (p) {
        p.classList.toggle('active', p.getAttribute('data-nox-tab') === tab);
      });
      // brief fade-in of the newly shown bracket (Tier 4 motion)
      view.classList.add('nox-animate');
      setTimeout(function () { view.classList.remove('nox-animate'); }, 350);
    });

    // Keep the bar alive across bracket.js re-renders of the silver view.
    function start() {
      var view = document.getElementById(VIEW_ID);
      if (!view) { setTimeout(start, 500); return; }
      ensureBar();
      new MutationObserver(function () { ensureBar(); }).observe(view, { childList: true });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  })();
  </script>

  <!-- Light/Dark theme toggle. Default is LIGHT (team preference); choice is saved
       to localStorage and applied pre-paint by the inline script up top. The button
       icon shows the theme you'll switch TO (☀ when dark, ☾ when light). -->
  <script>
  (function () {
    function wire() {
      var dash = document.getElementById('nox-dash');
      var btn = document.getElementById('nox-theme-toggle');
      if (!dash || !btn) { setTimeout(wire, 300); return; }
      function render() {
        var dark = dash.classList.contains('theme-dark');
        btn.textContent = dark ? '☀' : '☾';
        btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
      }
      render();
      btn.addEventListener('click', function () {
        var dark = dash.classList.toggle('theme-dark');
        try { localStorage.setItem('noxTheme', dark ? 'dark' : 'light'); } catch (e) {}
        render();
      });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire);
    else wire();
  })();
  </script>
</body>
</html>
