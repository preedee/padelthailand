<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Padel Thailand</title>
  <script>
    (function() {
      var path = window.location.pathname;
      // Store the original clean URL path, then redirect to the HTML page.
      // The target page will use history.replaceState to restore the clean URL.
      var orgMatch = path.match(/^\/organizer\/([^/]+)\/?$/);
      if (orgMatch) {
        sessionStorage.setItem('spa-redirect', path);
        window.location.replace('/organizer.html');
        return;
      }
      var compMatch = path.match(/^\/competitions\/([^/]+)\/?$/);
      if (compMatch) {
        sessionStorage.setItem('spa-redirect', path);
        window.location.replace('/competition.html');
        return;
      }
      // QA Critical-1 — smart fallback for deep tournament paths.
      // A mistyped community slug like /competitions/tps-may2026/community/typo/
      // used to bounce to the Padel Thailand calendar (confusing for captains
      // arriving from a shared link). Now: any unmatched path under a known
      // tournament directory falls back to that tournament's hub instead.
      var tournamentMatch = path.match(/^\/competitions\/([^/]+)\//);
      if (tournamentMatch) {
        var slug = tournamentMatch[1];
        if (slug === 'tps-may2026') {
          window.location.replace('/competitions/tps-may2026/home/');
          return;
        }
        // Other tournaments: fall back to their landing page.
        window.location.replace('/competitions/' + slug + '/');
        return;
      }
      // For any other 404, redirect to home
      window.location.replace('/');
    })();
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
